<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;user-select:none}
  canvas{border:2px solid rgba(255,255,255,0.15);border-radius:8px;max-width:100%;max-height:calc(100vh - 80px)}
  #info{font-size:12px;color:rgba(255,255,255,0.45);text-align:center;line-height:1.6}
  #start-btn{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;padding:10px 32px;font-size:15px;font-weight:600;border-radius:50px;cursor:pointer;box-shadow:0 4px 15px rgba(99,102,241,0.4);transition:all .2s;display:none}
  #start-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,0.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="start-btn" onclick="startGame()">Play Again</button>
<p id="info">W / S — left paddle &nbsp;|&nbsp; ↑ / ↓ — right paddle &nbsp;|&nbsp; First to 7 wins</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('start-btn');

const W = 800, H = 500;
canvas.width = W; canvas.height = H;

const PAD_W = 14, PAD_H = 80, BALL_R = 9, SPEED_INC = 0.4;

let state = {
  lY: H/2 - PAD_H/2, rY: H/2 - PAD_H/2,
  bx: W/2, by: H/2,
  vx: 5 * (Math.random() > 0.5 ? 1 : -1),
  vy: (Math.random()*3+2) * (Math.random()>0.5?1:-1),
  lScore: 0, rScore: 0, running: false, over: false,
  keys: {}
};

document.addEventListener('keydown', e => { state.keys[e.key] = true; e.preventDefault(); });
document.addEventListener('keyup',  e => { state.keys[e.key] = false; });

function startGame() {
  btn.style.display = 'none';
  state = { ...state, lY: H/2-PAD_H/2, rY: H/2-PAD_H/2,
    bx: W/2, by: H/2,
    vx: 5*(Math.random()>0.5?1:-1),
    vy: (Math.random()*3+2)*(Math.random()>0.5?1:-1),
    lScore:0, rScore:0, running:true, over:false };
  loop();
}

function resetBall(dir) {
  state.bx = W/2; state.by = H/2;
  state.vx = 5 * dir;
  state.vy = (Math.random()*3+2) * (Math.random()>0.5?1:-1);
}

const MOVE = 6;
function update() {
  // Paddles
  if (state.keys['w'] || state.keys['W']) state.lY = Math.max(0, state.lY - MOVE);
  if (state.keys['s'] || state.keys['S']) state.lY = Math.min(H-PAD_H, state.lY + MOVE);
  if (state.keys['ArrowUp'])   state.rY = Math.max(0, state.rY - MOVE);
  if (state.keys['ArrowDown']) state.rY = Math.min(H-PAD_H, state.rY + MOVE);

  // Ball movement
  state.bx += state.vx;
  state.by += state.vy;

  // Top / bottom bounce
  if (state.by - BALL_R < 0)  { state.by = BALL_R;  state.vy = Math.abs(state.vy); }
  if (state.by + BALL_R > H)  { state.by = H-BALL_R; state.vy = -Math.abs(state.vy); }

  // Left paddle collision
  const lx = 30;
  if (state.bx - BALL_R < lx + PAD_W && state.bx - BALL_R > lx &&
      state.by > state.lY && state.by < state.lY + PAD_H) {
    state.bx = lx + PAD_W + BALL_R;
    state.vx = Math.abs(state.vx) + SPEED_INC;
    const rel = (state.by - (state.lY + PAD_H/2)) / (PAD_H/2);
    state.vy = rel * 7;
  }

  // Right paddle collision
  const rx = W - 30 - PAD_W;
  if (state.bx + BALL_R > rx && state.bx + BALL_R < rx + PAD_W*2 &&
      state.by > state.rY && state.by < state.rY + PAD_H) {
    state.bx = rx - BALL_R;
    state.vx = -(Math.abs(state.vx) + SPEED_INC);
    const rel = (state.by - (state.rY + PAD_H/2)) / (PAD_H/2);
    state.vy = rel * 7;
  }

  // Cap speed
  state.vx = Math.min(Math.max(Math.abs(state.vx), 5), 18) * Math.sign(state.vx);

  // Score
  if (state.bx < 0) { state.rScore++; checkWin() || resetBall(1); }
  if (state.bx > W) { state.lScore++; checkWin() || resetBall(-1); }
}

function checkWin() {
  if (state.lScore >= 7 || state.rScore >= 7) {
    state.over = true; state.running = false;
    btn.style.display = 'block';
    return true;
  }
  return false;
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);

  // Centre line
  ctx.setLineDash([10, 14]);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);

  // Scores
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = 'bold 52px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(state.lScore, W/2 - 80, 70);
  ctx.fillText(state.rScore, W/2 + 80, 70);

  // Paddles
  const rnd = (x,y,w,h,r) => {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath(); ctx.fill();
  };
  ctx.fillStyle = '#6ee7b7';
  rnd(30, state.lY, PAD_W, PAD_H, 5);
  ctx.fillStyle = '#f9a8d4';
  rnd(W-30-PAD_W, state.rY, PAD_W, PAD_H, 5);

  // Ball
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(255,255,255,0.6)';
  ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(state.bx, state.by, BALL_R, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Game-over / start overlay
  if (state.over) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 42px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.lScore > state.rScore ? 'Left wins! 🎉' : 'Right wins! 🎉', W/2, H/2-20);
    ctx.font = '20px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText(`${state.lScore} — ${state.rScore}`, W/2, H/2+20);
  } else if (!state.running) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 44px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PONG', W/2, H/2 - 40);
    ctx.font = '20px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('Click anywhere to start', W/2, H/2 + 10);
  }
}

function loop() {
  if (!state.running) return;
  update(); draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('click', () => {
  if (!state.running && !state.over) startGame();
});

// Initial draw (title screen)
draw();
</script>
</body>
</html>
